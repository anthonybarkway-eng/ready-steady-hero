<meta name="claude:viewport-fit-sides" content="cover">
<title>Ready Steady Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
<style>
/* Layout: one 4:3 cartoon stage scaled to fit the screen; 1rem = 1% of stage width. Single bright look by choice; the sky darkens as the mission nears its end. */
:root{
  --u:10px;
  --frame:#17213a;
  --sky1:#8fd8ff; --sky2:#ecf9ff; --grass:#8bdc5c; --grass2:#5fbf3f; --road:#464860;
  --ink:#1d3557; --muted:#5a6b85; --card:#ffffff; --bubble:#ffffff;
  --red:#e63946; --red2:#a4262f; --amber:#ffb703; --green:#2dc653; --sun:#ffd166; --sun2:#c9961d; --orange:#f4a261; --blue:#4cc9f0;
  --shadow:rgba(20,30,60,.22);
  --font:"Fredoka", ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Nunito", system-ui, sans-serif;
}
html{ font-size:var(--u); height:100%; }
body{ height:100%; margin:0; box-sizing:border-box; background:var(--frame); color:var(--ink); font-family:var(--font); overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:8px;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; overscroll-behavior:none; touch-action:none; -webkit-tap-highlight-color:transparent; }
#area{ position:relative; width:100%; height:100%; }
#stage{ position:absolute; left:50%; top:50%; width:100rem; height:75rem; transform:translate(-50%,-50%); overflow:hidden; border-radius:1.5rem;
  background:linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 58%, var(--grass) 58%, var(--grass2) 100%); box-shadow:0 0 0 .4rem rgba(255,255,255,.08); }
.layer{ position:absolute; inset:0; }
#scene{ z-index:1; }
#stars{ z-index:0; pointer-events:none; opacity:0; transition:opacity 1.5s; font-size:3rem; }
#stars.on{ opacity:1; }
#stars span{ position:absolute; animation:twinkle 2s ease-in-out infinite alternate; }
@keyframes twinkle{ from{ opacity:.4 } to{ opacity:1 } }
button{ font-family:var(--font); color:var(--ink); cursor:pointer; touch-action:none; }
button:focus-visible{ outline:.5rem solid var(--sun); outline-offset:.3rem; }

/* top strip, calm cloud, parent gear, sticker book */
#top{ z-index:7; pointer-events:none; }
#cloud,#gear{ pointer-events:auto; position:absolute; top:1.2rem; border-radius:50%; border:0; line-height:1; }
#cloud{ left:1.5rem; width:7.5rem; height:7.5rem; background:var(--card); font-size:4rem; box-shadow:0 .5rem 0 var(--shadow); }
#cloud:active{ transform:translateY(.3rem); box-shadow:0 .2rem 0 var(--shadow); }
#gear{ right:1.5rem; width:6rem; height:6rem; background:rgba(255,255,255,.35); font-size:3rem; color:#fff; }
.holdable.holding{ animation:holdring 1.5s linear forwards; }
@keyframes holdring{ from{ box-shadow:0 0 0 0 var(--sun) } to{ box-shadow:0 0 0 1.4rem var(--sun) } }
#strip{ position:absolute; left:50%; top:1.4rem; transform:translateX(-50%); display:flex; align-items:center; gap:.8rem; background:rgba(255,255,255,.72); border-radius:4rem; padding:.7rem 1.4rem; }
.stop{ width:5rem; height:5rem; border-radius:50%; background:#dfe9f3; display:grid; place-items:center; font-size:2.8rem; line-height:1; opacity:.55; transition:all .4s; }
.stop.cur{ opacity:1; background:var(--card); box-shadow:0 0 0 .5rem var(--sun); transform:scale(1.12); }
.stop.done{ opacity:1; background:#d8f5d0; color:#1f7a2e; font-weight:700; }
.dash{ width:2rem; height:0; border-top:.5rem dashed rgba(255,255,255,.95); }
#badge{ pointer-events:none; position:absolute; right:1.5rem; bottom:1.5rem; max-width:26rem; min-height:6rem; border-radius:3rem; background:rgba(255,255,255,.92); display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:.3rem; padding:.6rem 1.2rem; box-sizing:border-box; font-size:3.2rem; line-height:1; box-shadow:0 .5rem 0 var(--shadow); }
#badge:empty{ display:none; }
#badge span{ display:inline-block; animation:pop .55s cubic-bezier(.2,1.6,.4,1) both; }
#badge.bump{ animation:bump .5s ease; }
@keyframes pop{ from{ transform:scale(0) rotate(-30deg) } to{ transform:scale(1) rotate(0) } }
@keyframes bump{ 30%{ transform:scale(1.15) } }

/* guide: Whiskers + speech bubble, ghost hand */
#guide{ z-index:6; pointer-events:none; }
#whiskers{ position:absolute; left:.5rem; bottom:-.5rem; width:23rem; height:23rem; transform-origin:50% 100%; }
#whiskers svg{ width:100%; height:100%; overflow:visible; }
#whiskers.talking{ animation:talk .3s ease-in-out infinite alternate; }
@keyframes talk{ from{ transform:scaleY(1) } to{ transform:scaleY(1.035) translateY(-.4rem) } }
#whiskers.breath{ animation:breath 3.2s ease-in-out 1; }
@keyframes breath{ 0%{transform:scale(1)} 45%{transform:scale(1.12)} 60%{transform:scale(1.12)} 100%{transform:scale(1)} }
#whiskers.wave{ animation:wave .45s ease-in-out 5 alternate; }
@keyframes wave{ from{ transform:rotate(-5deg) } to{ transform:rotate(6deg) translateY(-.6rem) } }
#bubble{ position:absolute; left:24.5rem; bottom:8rem; max-width:48rem; background:var(--bubble); border-radius:3rem; padding:1.5rem 2.4rem; font-size:3.4rem; line-height:1.15; font-weight:600; box-shadow:0 .6rem 0 var(--shadow); }
#bubble:after{ content:''; position:absolute; left:-1.5rem; bottom:2.4rem; border:1.3rem solid transparent; border-right-color:var(--bubble); border-left:0; }
#bubble.listen{ box-shadow:0 0 0 .9rem var(--sun), 0 .6rem 0 var(--shadow); }
#bubble.listen:before{ content:'👂 '; }
#think,#mic{ position:absolute; left:24.5rem; bottom:60rem; display:none; background:rgba(29,53,87,.92); color:#fff; border-radius:3rem; padding:1.2rem 2.4rem; font-size:3.6rem; font-weight:700; white-space:nowrap; box-shadow:0 .6rem 0 rgba(0,0,0,.25); }
#think.on,#mic.on{ display:block; animation:pop .45s cubic-bezier(.2,1.6,.4,1) both; }
#mic.on{ background:var(--red); animation:pop .45s cubic-bezier(.2,1.6,.4,1) both, micpulse 1s ease-in-out .45s infinite alternate; }
@keyframes micpulse{ from{ box-shadow:0 .6rem 0 rgba(0,0,0,.25), 0 0 0 0 rgba(230,57,70,.6) } to{ box-shadow:0 .6rem 0 rgba(0,0,0,.25), 0 0 0 1.4rem rgba(230,57,70,0) } }
#ghost{ position:absolute; z-index:8; font-size:9rem; line-height:1; pointer-events:none; opacity:0; transform:translate(-35%,-10%); transition:opacity .3s; filter:drop-shadow(0 .5rem .5rem rgba(0,0,0,.3)); }
#ghost.on{ opacity:1; animation:tapbounce .6s ease-in-out infinite alternate; }
@keyframes tapbounce{ from{ transform:translate(-35%,-10%) } to{ transform:translate(-35%,-32%) } }
#ghost.on.press{ animation:none; transform:translate(-35%,-4%) scale(.88); }
#ghost.on.lift{ animation:ghostlift 1.4s ease forwards; }
@keyframes ghostlift{ from{ transform:translate(-35%,-10%); opacity:1 } to{ transform:translate(-35%,-110%); opacity:0 } }

/* shared pieces */
.banner{ position:absolute; left:50%; top:10.5rem; transform:translateX(-50%); font-size:4.4rem; font-weight:700; color:#fff; text-shadow:0 .35rem 0 rgba(0,0,0,.22); white-space:nowrap; }
.big{ font-weight:700; font-size:7rem; line-height:1; padding:2rem 7rem; border:0; border-radius:5rem; background:var(--red); color:#fff; box-shadow:0 1.2rem 0 var(--red2); letter-spacing:.1rem; }
.big:active{ transform:translateY(.8rem); box-shadow:0 .4rem 0 var(--red2); }
.pcard{ border:0; background:var(--card); border-radius:3rem; box-shadow:0 1rem 0 var(--shadow); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.6rem; padding:0; }
.pcard:active{ transform:translateY(.5rem); box-shadow:0 .5rem 0 var(--shadow); }
.pcard .emo{ font-size:11rem; line-height:1; }
.pcard .word{ font-size:3rem; color:var(--muted); font-weight:600; }
.wobble{ animation:wobble .6s ease; }
@keyframes wobble{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(-1.6rem) rotate(-3deg)} 75%{transform:translateX(1.6rem) rotate(3deg)} }
.win{ animation:win .8s ease both; background:#d8f5d0 !important; }
@keyframes win{ 0%{transform:scale(1)} 40%{transform:scale(1.18) rotate(-4deg)} 100%{transform:scale(1.08)} }
.faded{ opacity:.22; pointer-events:none; }
.opts{ position:absolute; left:50%; top:19rem; transform:translateX(-50%); display:flex; gap:2.4rem; }
.opts .pcard{ width:19rem; height:24rem; }
.again-btn,.next-btn{ position:absolute; bottom:13rem; width:15rem; height:15rem; border-radius:50%; border:0; font-size:6.5rem; line-height:1; box-shadow:0 1rem 0 var(--shadow); background:#fff; }
.again-btn{ right:23rem; } .next-btn{ right:4rem; background:var(--green); color:#fff; }
.again-btn.used{ opacity:.35; }
.again-btn:active,.next-btn:active{ transform:translateY(.5rem); box-shadow:0 .5rem 0 var(--shadow); }

/* intro */
.title{ position:absolute; left:50%; top:9rem; transform:translateX(-50%); text-align:center; width:90rem; }
.t1{ font-size:7rem; font-weight:700; color:#fff; text-shadow:0 .5rem 0 rgba(0,0,0,.2); line-height:1; }
.t2{ font-size:15rem; font-weight:700; color:var(--red); -webkit-text-stroke:.35rem #fff; text-shadow:0 .9rem 0 rgba(0,0,0,.18); line-height:1; margin:0 0 3rem; }
.tiny{ margin-top:2.2rem; font-size:2.6rem; color:#fff; text-shadow:0 .2rem 0 rgba(0,0,0,.25); }
.title .big{ display:block; margin:0 auto; }
.tiny-btn{ display:block; margin:1.6rem auto 0; font-size:2.3rem; padding:.8rem 2rem; border-radius:2rem; border:0; background:rgba(255,255,255,.28); color:#fff; }
.pop-in{ animation:pop .6s cubic-bezier(.2,1.6,.4,1) both; }
.banner.sm{ font-size:3.5rem; }

/* balloon */
.balloon-wrap{ position:absolute; left:50%; top:36rem; transform:translate(-50%,-50%); width:34rem; height:36rem; display:grid; place-items:center; }
.balloon{ width:17rem; height:22rem; transition:transform 4s ease-in-out; transform-origin:50% 95%; touch-action:none; }
.balloon.inflate{ transform:scale(1.7); }
.balloon svg{ width:100%; height:100%; overflow:visible; pointer-events:none; }
.prompt{ position:absolute; left:50%; top:11rem; transform:translateX(-50%); font-size:4.8rem; font-weight:700; color:#fff; text-shadow:0 .35rem 0 rgba(0,0,0,.22); white-space:nowrap; }
.faces{ position:absolute; left:50%; top:21rem; transform:translateX(-50%); display:flex; gap:2.4rem; }
.faces .pcard{ width:19rem; height:25rem; }
.faces .word{ font-size:3.4rem; }

/* traffic */
.road{ position:absolute; left:0; right:0; top:34rem; height:16rem; background:var(--road); }
.road:before{ content:''; position:absolute; left:0; right:0; top:50%; height:1rem; margin-top:-.5rem; background:repeating-linear-gradient(90deg,#fff 0 6rem, transparent 6rem 10rem); }
.holdzone{ position:absolute; left:0; right:0; top:28rem; height:28rem; touch-action:none; }
.ruby{ position:absolute; left:6rem; top:32.5rem; width:34rem; height:16rem; transition:left 2.3s cubic-bezier(.55,0,.9,.45); pointer-events:none; }
.ruby svg{ width:100%; height:100%; overflow:visible; }
.ruby.go{ left:112rem; }
.ruby.rev{ animation:rev .12s linear infinite alternate; }
@keyframes rev{ from{ transform:translateY(0) } to{ transform:translateY(-.35rem) } }
.ruby .wheel{ transform-box:fill-box; transform-origin:center; }
.ruby.spin .wheel{ animation:spin .22s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg) } }
.tlight{ position:absolute; right:3rem; top:8rem; width:9.5rem; padding:1rem 0; border-radius:3rem; background:#2b2d42; display:flex; flex-direction:column; align-items:center; gap:1rem; box-shadow:0 .8rem 0 rgba(0,0,0,.3); }
.tlight:after{ content:''; position:absolute; left:50%; top:100%; width:1.8rem; height:8rem; margin-left:-.9rem; background:#2b2d42; }
.lamp{ width:6.8rem; height:6.8rem; border-radius:50%; background:#3d3f52; transition:all .2s; }
.lamp.r.on{ background:var(--red); box-shadow:0 0 3rem var(--red); }
.lamp.a.on{ background:var(--amber); box-shadow:0 0 3rem var(--amber); }
.lamp.g.on{ background:var(--green); box-shadow:0 0 3rem var(--green); }
.finish{ position:absolute; right:15rem; top:24rem; font-size:9rem; line-height:1; }
.looks{ position:absolute; left:50%; top:17rem; transform:translateX(-50%); display:flex; gap:6rem; }
.lookbtn{ width:16rem; height:12rem; border:0; border-radius:3rem; background:#fff; font-size:7rem; line-height:1; box-shadow:0 1rem 0 var(--shadow); }
.lookbtn.done{ background:#d8f5d0; }

/* flash cards */
.flashcard{ position:absolute; left:50%; top:16rem; transform:translateX(-50%); width:36rem; height:34rem; background:#fff; border-radius:4rem; box-shadow:0 1.2rem 0 var(--shadow); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1rem; }
.flashcard .emo{ font-size:16rem; line-height:1; }
.flashcard .word{ font-size:4.4rem; color:var(--muted); font-weight:700; }
.flashcard.pop{ animation:fpop .22s ease; }
@keyframes fpop{ from{ transform:translateX(-50%) scale(.9) } to{ transform:translateX(-50%) scale(1) } }

/* karuta */
.cards{ position:absolute; left:50%; top:21rem; transform:translateX(-50%); display:flex; flex-wrap:wrap; justify-content:center; gap:2.2rem; width:90rem; }
.cards.n4 .pcard{ width:19rem; height:24rem; }
.cards.n6 .pcard{ width:13.6rem; height:19.5rem; }
.cards.n8 .pcard{ width:17rem; height:15.5rem; gap:.2rem; }
.cards.n6 .emo,.cards.n8 .emo{ font-size:8rem; }
.cards.n6 .word,.cards.n8 .word{ font-size:2.4rem; }
.hand{ position:absolute; left:50%; top:60rem; font-size:9rem; line-height:1; transform:translate(-35%,-12%); transition:left .8s ease, top .8s ease, opacity .3s; pointer-events:none; opacity:0; filter:drop-shadow(0 .5rem .5rem rgba(0,0,0,.3)); }

/* shapes */
.tray{ position:absolute; left:3rem; top:12rem; width:43rem; height:44rem; border-radius:3rem; background:rgba(255,255,255,.35); }
.build{ position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; transition:transform 2.4s ease-in; }
.build.still{ transition:none; }
.build.launch{ transform:translate(28rem,-110rem); }
.build.driveoff{ transform:translateX(-125rem); }
.build.chug{ transform:translateX(-125rem); transition-timing-function:cubic-bezier(.5,0,.9,.6); }
/* the finished picture: blocks fade away, the real thing pops in on top */
.build.real .piece,.build.real .slot{ opacity:0; transform:scale(.4); transition:opacity .5s ease, transform .5s ease; }
.realpic{ position:absolute; transform:translate(-50%,-50%); line-height:1; z-index:3; animation:realpop .7s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes realpop{ from{ transform:translate(-50%,-50%) scale(0) rotate(-25deg) } to{ transform:translate(-50%,-50%) scale(1) rotate(0) } }
.realpic .emoji{ display:block; filter:drop-shadow(0 .8rem 0 rgba(0,0,0,.18)); }
.realpic .fire,.realpic .dust,.realpic .steam{ position:absolute; line-height:1; opacity:0; }
.realpic .fire{ font-size:.42em; left:-28%; top:66%; transform:rotate(-135deg); transform-origin:50% 50%; }
.realpic .fire.f2{ font-size:.28em; left:-42%; top:84%; }
.build.launch .fire{ opacity:1; animation:flick .1s infinite alternate; }
.build.launch .fire.f2{ animation-duration:.14s; }
@keyframes flick{ from{ transform:rotate(-135deg) scale(1) } to{ transform:rotate(-135deg) scale(1.3) } }
.realpic .dust{ font-size:.5em; right:-45%; top:45%; transform:scaleX(-1); }
.build.driveoff .dust{ opacity:1; animation:dusty .5s infinite alternate; }
@keyframes dusty{ from{ transform:scaleX(-1) scale(.9) } to{ transform:scaleX(-1) scale(1.2) translateX(-.3em) } }
.realpic .steam{ font-size:.45em; left:-4%; top:-30%; }
.realpic .steam.s2{ left:-16%; } .realpic .steam.s3{ left:8%; }
.build.chug .steam{ animation:steamup 1.1s ease-out infinite; }
.build.chug .steam.s2{ animation-delay:.35s; } .build.chug .steam.s3{ animation-delay:.7s; }
@keyframes steamup{ 0%{ opacity:0; transform:translateY(0) scale(.5) } 20%{ opacity:.95 } 100%{ opacity:0; transform:translateY(-1.6em) scale(1.3) } }
.piece{ position:absolute; touch-action:none; cursor:grab; filter:drop-shadow(0 .6rem 0 rgba(0,0,0,.18)); transition:left .35s ease, top .35s ease; z-index:2; }
.piece.drag{ transition:none; z-index:5; }
.piece.locked{ pointer-events:none; z-index:1; }
.piece svg,.slot svg{ width:100%; height:100%; overflow:visible; display:block; }
.slot{ position:absolute; pointer-events:none; }

/* counting */
.carrow{ position:absolute; left:50%; top:19rem; transform:translateX(-50%); display:flex; gap:1.4rem; white-space:nowrap; }
.ccar{ position:relative; font-size:10rem; line-height:1; border:0; background:transparent; padding:1rem .4rem .4rem; }
.carrow.n7 .ccar,.carrow.n8 .ccar{ font-size:8.6rem; }
.carrow.n9,.carrow.n10{ top:16.5rem; width:56rem; flex-wrap:wrap; justify-content:center; gap:4.5rem 1rem; white-space:normal; }
.carrow.n9 .ccar,.carrow.n10 .ccar{ font-size:7rem; }
.carrow.n9~.nums,.carrow.n10~.nums{ top:41.5rem; }
.ccar .num{ position:absolute; left:50%; top:-4rem; transform:translateX(-50%) scale(0); width:6rem; height:6rem; border-radius:50%; background:var(--sun); font-size:3.6rem; font-weight:700; display:grid; place-items:center; transition:transform .3s cubic-bezier(.2,1.6,.4,1); }
.ccar.counted .num{ transform:translateX(-50%) scale(1); }
.ccar.counted{ animation:win .6s ease; }
.nums{ position:absolute; left:50%; top:38rem; transform:translateX(-50%); display:flex; gap:2.4rem; }
.numbtn{ width:13rem; height:13rem; border-radius:3rem; border:0; background:#fff; font-size:7rem; font-weight:700; box-shadow:0 1rem 0 var(--shadow); }
.numbtn:active{ transform:translateY(.5rem); box-shadow:0 .5rem 0 var(--shadow); }
.dotcard{ position:absolute; left:50%; top:9rem; transform:translateX(-50%); width:27rem; height:27rem; background:#fff; border-radius:4rem; box-shadow:0 1.2rem 0 var(--shadow); display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); padding:2.5rem; box-sizing:border-box; }
.dot{ width:5rem; height:5rem; border-radius:50%; background:var(--red); place-self:center; }
.dotcard.hide .dot{ visibility:hidden; }
.dotcard.hide:after{ content:'?'; position:absolute; inset:0; display:grid; place-items:center; font-size:14rem; font-weight:700; color:#c9d3e0; }

/* letter painting */
.lbox{ position:absolute; left:13rem; top:15rem; width:40rem; height:40rem; }
.lbox svg{ width:100%; height:100%; touch-action:none; overflow:visible; }
.guide{ stroke:#dfe7f2; stroke-width:14; stroke-linecap:round; stroke-linejoin:round; fill:none; }
.paint{ stroke:var(--red); stroke-width:14; stroke-linecap:round; stroke-linejoin:round; fill:none; }
.startdot{ fill:var(--green); }
.lbox.done{ animation:win .8s ease both; }
.lname{ position:absolute; left:58rem; top:14rem; font-size:6rem; font-weight:700; color:#fff; text-shadow:0 .4rem 0 rgba(0,0,0,.2); white-space:nowrap; }
.lname b{ color:var(--red); -webkit-text-stroke:.2rem #fff; }
.hoot{ position:absolute; left:80rem; top:24rem; width:15rem; height:17rem; }
.hoot svg{ width:100%; height:100%; overflow:visible; }

/* shark snack */
.water{ position:absolute; inset:0; background:linear-gradient(180deg, rgba(76,201,240,.5), rgba(0,119,182,.72)); }
.finn{ position:absolute; left:1rem; top:23rem; width:32rem; height:20rem; }
.finn svg{ width:100%; height:100%; overflow:visible; }
.finn.chomp{ animation:chomp .35s ease; }
@keyframes chomp{ 50%{ transform:scale(1.08) rotate(-4deg) } }
.finn.ouch{ animation:wobble .6s ease; }
.item{ position:absolute; font-size:9rem; line-height:1; border:0; background:transparent; padding:.5rem; transition:left linear; touch-action:none; }
.item.eat{ transition:left .45s ease-in, top .45s ease-in, transform .45s ease-in; transform:scale(.2); }
.item.puff{ transition:top 1.2s ease-out, transform .3s ease, opacity 1.2s; transform:scale(1.5); opacity:0; pointer-events:none; }
.fishcount{ position:absolute; right:3rem; top:17rem; font-size:4.4rem; font-weight:700; color:#fff; text-shadow:0 .3rem 0 rgba(0,0,0,.25); }

/* finale */
.hq{ position:absolute; left:50%; top:9rem; transform:translateX(-50%); text-align:center; }
.hq-title{ font-size:7.5rem; font-weight:700; color:#fff; text-shadow:0 .5rem 0 rgba(0,0,0,.2); line-height:1; }
.badge-big{ margin:1.6rem auto 0; width:34rem; height:34rem; border-radius:50%; background:radial-gradient(#fff5c2,var(--sun)); box-shadow:0 1.4rem 0 var(--sun2), 0 0 0 1.6rem #fff; display:grid; grid-template-columns:1fr 1fr 1fr; place-items:center; gap:.3rem; padding:4.5rem; box-sizing:border-box; }
.bs{ font-size:6.5rem; line-height:1; animation:pop .6s cubic-bezier(.2,1.6,.4,1) both; }
.badge-big{ transition:transform .6s ease, opacity .6s ease; }
.badge-big.away{ transform:scale(0); opacity:0; }
.gold{ position:absolute; left:50%; top:7rem; width:38rem; height:45rem; transform:translateX(-50%); animation:goldin .9s cubic-bezier(.2,1.5,.4,1) both; filter:drop-shadow(0 1.2rem 0 rgba(0,0,0,.2)); }
.gold svg{ width:100%; height:100%; overflow:visible; }
.gold .gloss{ animation:gloss 2.4s ease-in-out infinite; }
@keyframes gloss{ 0%{ transform:translateX(-30px) skewX(-22deg) } 55%,100%{ transform:translateX(230px) skewX(-22deg) } }
@keyframes goldin{ from{ transform:translateX(-50%) scale(0) rotate(-25deg) } to{ transform:translateX(-50%) scale(1) rotate(0) } }

};
let eng=null;

const MALE=/daniel|oliver|arthur|aaron|fred|rishi|gordon|\blee\b|\btom\b|alex|evan|nathan|reed|rocko|eddy|grandpa|ralph|bruce|junior|albert|bahh|bells|boing|bubbles|cellos|deranged|good news|bad news|hysterical|jester|organ|superstar|trinoids|whisper|wobble|zarvox/i;

  const vs=englishVoices().slice().sort((a,b)=>(/enhanced|premium/i.test(b.name)?1:0)-(/enhanced|premium/i.test(a.name)?1:0)); if(!vs.length) return;

async function thinkPause(api,line){ holdLock++; thinkEl.classList.add('on'); placeCues(); sfx.boop();

// ---------- strip, sky, stickers, confetti, ghost hand
const strip=$('#strip'), badge=$('#badge');
const stickers=[], doneList=[];
function addSticker(e){ stickers.push(e); const s=document.createElement('span'); s.textContent=e; badge.appendChild(s); badge.classList.remove('bump'); void badge.offsetWidth; badge.classList.add('bump'); sfx.pop(); }
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const toHex=c=>'#'+c.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');
const mix=(a,b,t)=>toHex(hex(a).map((v,i)=>v+(hex(b)[i]-v)*t));
const SKY=[['#8fd8ff','#ecf9ff'],['#ffb27a','#ffe9c7'],['#1e2b5c','#5d6fa6']];
function setSky(f){ f=Math.max(0,Math.min(1,f)); let c; if(f<.7){ const t=f/.7; c=[mix(SKY[0][0],SKY[1][0],t),mix(SKY[0][1],SKY[1][1],t)]; } else { const t=(f-.7)/.3; c=[mix(SKY[1][0],SKY[2][0],t),mix(SKY[1][1],SKY[2][1],t)]; }
  stage.style.setProperty('--sky1',c[0]); stage.style.setProperty('--sky2',c[1]); $('#stars').classList.toggle('on',f>=.95); }
$('#stars').innerHTML=Array.from({length:14},(_,i)=>`<span style="left:${(i*7.3+3)%96}rem;top:${(i*5.1+2)%26}rem;animation-delay:${(i*.37)%2}s">✦</span>`).join('');
const fx=$('#fx'), fctx=fx.getContext('2d');
function confetti(n){
  n=n||140; const r=stage.getBoundingClientRect(); const dpr=Math.min(window.devicePixelRatio||1,2);
  fx.width=Math.round(r.width*dpr); fx.height=Math.round(r.height*dpr); fctx.setTransform(dpr,0,0,dpr,0,0);
  const k=r.width/1024, cols=['#e63946','#ffd166','#2dc653','#4cc9f0','#f4a261','#b5179e'], ps=[];
  for(let i=0;i<n;i++) ps.push({x:r.width/2+rnd(-80,80)*k, y:r.height*.42, vx:rnd(-9,9)*k, vy:rnd(-17,-6)*k, g:.45*k, s:rnd(7,13)*k, c:cols[i%cols.length], rot:rnd(0,6.28), vr:rnd(-.3,.3), life:rnd(70,120)});
  const step=()=>{ fctx.clearRect(0,0,r.width,r.height); let any=false;
    for(const p of ps){ if(p.life<=0) continue; any=true; p.life--; p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.vx*=.99; p.rot+=p.vr;
      fctx.save(); fctx.translate(p.x,p.y); fctx.rotate(p.rot); fctx.globalAlpha=Math.min(1,p.life/20); fctx.fillStyle=p.c; fctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); fctx.restore(); }
    if(any) requestAnimationFrame(step); else fctx.clearRect(0,0,r.width,r.height); };
  requestAnimationFrame(step);
}
const ghostEl=$('#ghost'); let ghostT=null;
function posOf(el){ const r=el.getBoundingClientRect(), s=stage.getBoundingClientRect(); return {x:(r.left+r.width/2-s.left)/s.width*100, y:(r.top+r.height/2-s.top)/s.height*75}; }
function ghost(el,o){ if(!el) return; o=o||{}; const p=posOf(el); ghostEl.style.left=p.x+'rem'; ghostEl.style.top=p.y+'rem'; ghostEl.classList.remove('lift'); ghostEl.classList.toggle('press',!!o.press); ghostEl.classList.add('on'); clearTimeout(ghostT); if(!o.hold) ghostT=setTimeout(()=>ghostEl.classList.remove('on','press'),2600); }
function ghostLift(){ ghostEl.classList.remove('press'); ghostEl.classList.add('lift'); clearTimeout(ghostT); ghostT=setTimeout(()=>ghostEl.classList.remove('on','lift'),1500); }
function wobble(el){ el.classList.remove('wobble'); void el.offsetWidth; el.classList.add('wobble'); }
function holdButton(el,ms,fn){ let t=null; const stop=()=>{ clearTimeout(t); t=null; el.classList.remove('holding'); };
  el.addEventListener('pointerdown',e=>{ e.preventDefault(); e.stopPropagation(); try{ el.setPointerCapture(e.pointerId); }catch(x){} el.classList.add('holding'); t=setTimeout(()=>{ stop(); fn(); },ms); });
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,stop)); }
// "Again, once": a bounded replay, then on we go. Practises accepting an ending in miniature.
function offerAgain(root,api,replay){ return new Promise(res=>{
  const a=document.createElement('button'); a.className='again-btn'; a.textContent='🔁'; a.setAttribute('aria-label','Again');
  const n=document.createElement('button'); n.className='next-btn'; n.textContent='➡'; n.setAttribute('aria-label','Next');
  root.appendChild(a); root.appendChild(n); let used=false, gone=false;
  const finish=()=>{ if(gone) return; gone=true; a.remove(); n.remove(); api.hint=null; res(); };
  api.hint=()=>{ say('Again? Or next stop?'); ghost(n); };
  const t=setTimeout(()=>{ if(!gone&&!used&&api.alive()) finish(); },25000);
  a.addEventListener('pointerdown',async()=>{ if(used||gone) return; used=true; clearTimeout(t); a.classList.add('used'); api.hint=null;
    await say('One more time! Then we go on.'); if(!api.alive()) return; await replay(); if(!api.alive()) return;
    await say('That was the last one. Next stop!'); if(api.alive()) finish(); });
  n.addEventListener('pointerdown',()=>{ if(gone) return; clearTimeout(t); finish(); });
  say('Again? Or next stop?'); ghost(n);
});}

// ---------- balloon breathing widget (opening ritual, and the calm cloud)
// With demo:true the first breath is shown: a hand presses the balloon while it fills, lifts off while it empties, then it is the child's turn.
function balloonWidget(root,o){
  const breaths=o.breaths||1, alive=o.alive||(()=>true);
  root.innerHTML=`<div class="balloon-wrap"><div class="balloon">${BALLOON_SVG}</div></div>`;
  const b=root.querySelector('.balloon'); let count=0, holding=false, t0=0, holdTimer=null, finished=false, enabled=!o.demo;
  const down=e=>{ if(finished||!enabled) return; e.preventDefault(); try{ b.setPointerCapture(e.pointerId); }catch(x){} if(holding) return;
    holding=true; t0=performance.now(); b.classList.add('inflate'); say('Breathe in…'); sweep(200,420,4);
    holdTimer=setTimeout(()=>{ if(holding&&alive()) say('Hold it… lovely.'); },4200); };
  const up=()=>{ if(!holding) return; holding=false; clearTimeout(holdTimer); const held=performance.now()-t0; b.classList.remove('inflate'); if(!alive()) return;
    if(held<1800){ say('Slowly… hold the balloon a bit longer.'); return; }
    count++; sweep(420,200,4); say('And breathe out… slowly.');
    if(count>=breaths){ finished=true; setTimeout(()=>{ if(alive()&&o.onDone) o.onDone(); },3800); } };
  b.addEventListener('pointerdown',down); b.addEventListener('pointerup',up); b.addEventListener('pointercancel',up);
  if(o.demo){ (async()=>{
    await (o.before||wait(400)); if(!alive()) return; await wait(300); if(!alive()) return;
    ghost(b,{hold:true,press:true}); b.classList.add('inflate'); sweep(200,420,4);
    await Promise.all([say('Tap and hold the balloon with your finger, and take a deep breath in at the same time.'), wait(4300)]); if(!alive()) return;
    ghostLift(); b.classList.remove('inflate'); sweep(420,200,4);
    await Promise.all([say('Now lift your finger, and breathe out slowly.'), wait(4300)]); if(!alive()) return;
    await say('Now you have a go yourself!'); if(!alive()) return;
    enabled=true; ghost(b); if(o.onReady) o.onReady(b);
  })(); }
  return b;
}

// lay the loose pieces out in the tray: tallest first, each one in the first row it fits in
function trayLayout(pieces){ const order=shuffle(pieces.map((p,i)=>i)).sort((a,b)=>pieces[b].h-pieces[a].h); const rows=[]; const pos=[];
  order.forEach(i=>{ const p=pieces[i]; let r=rows.find(r=>r.x+p.w<=44); if(!r){ r={x:5, y:rows.length?rows[rows.length-1].y+rows[rows.length-1].h+2:14, h:0}; rows.push(r); } pos[i]=[r.x,r.y]; r.x+=p.w+2; r.h=Math.max(r.h,p.h); });
  return pos; }

  Y:{ strokes:[[[20,10],[50,52]],[[80,10],[50,52]],[[50,52],[50,88]]], words:[['🪀','yo-yo'],['🟡','yellow'],['🛥️','yacht'],['🧶','yarn']] }
};
const DISTRACTORS=[['🚗','car'],['🐟','fish'],['🐱','cat'],['🐶','dog'],['🚌','bus'],['⚽','ball'],['🌞','sun'],['🎩','hat'],['🏠','house'],['🦈','shark'],['🍌','banana'],['🐸','frog']];
// Three different letters from his name each play, picked at random from the ones that have a stroke guide.
const NAME_LETTERS=Array.from(new Set('ZACHARY'.split(''))).filter(L=>LETTERS[L]);
const letterScene={ key:'letter', icon:'✏️', name:'the letters', sticker:'✏️', done:'you painted the letters', enter(root,api){
  const MISSION_LETTERS=shuffle(NAME_LETTERS.slice()).slice(0,3); letterScene.done=`you painted the letters ${MISSION_LETTERS[0]}, ${MISSION_LETTERS[1]} and ${MISSION_LETTERS[2]}`;
  let stumbles=0; const path=pts=>'M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L ');
  const runLetter=(L,idx)=>new Promise(resolve=>{
    const def=LETTERS[L]; const words=shuffle(def.words.slice()); const target=words[0]; const like=`${words[1][1]} and ${words[2][1]}`;
    const first=(NAME().charAt(0).toUpperCase()===L);
    const nameHtml=NAME().split('').map(ch=>(ch.toUpperCase()===L?`<b>${ch}</b>`:ch)).join('');
    root.innerHTML=`<div class="banner">Paint the letter ${L}!</div><div class="lbox" id="lbox"><svg viewBox="0 0 100 100" id="lsvg">${def.strokes.map(s=>`<path class="guide" d="${path(s)}"/>`).join('')}${def.strokes.map((s,i)=>`<path class="paint" data-i="${i}" d="${path(s)}"/>`).join('')}<circle class="startdot" id="sdot" r="6"/></svg></div><div class="lname">${L} is for ${first?nameHtml:target[1]}</div><div class="hoot">${HOOT_SVG}</div>`;
    const svg=root.querySelector('#lsvg'), paints=[].slice.call(root.querySelectorAll('.paint')), sdot=root.querySelector('#sdot');
    const lens=def.strokes.map(s=>{ let l=0; for(let i=1;i<s.length;i++) l+=Math.hypot(s[i][0]-s[i-1][0],s[i][1]-s[i-1][1]); return l; });
    paints.forEach(p=>{ const L2=p.getTotalLength(); p.style.strokeDasharray=L2; p.style.strokeDashoffset=L2; p.dataset.len=L2; });
    let si=0, prog=0, down=false;
    const setDot=()=>{ const s=def.strokes[si]; sdot.setAttribute('cx',s[0][0]); sdot.setAttribute('cy',s[0][1]); }; setDot();
    const toSvg=e=>{ const r=svg.getBoundingClientRect(); return [(e.clientX-r.left)/r.width*100,(e.clientY-r.top)/r.height*100]; };
    // arc-length position of the pointer along the current stroke, with its distance from the stroke
    const project=(pt)=>{ const s=def.strokes[si]; let acc=0, best={d:1e9,t:0}; for(let i=1;i<s.length;i++){ const a=s[i-1], b=s[i]; const vx=b[0]-a[0], vy=b[1]-a[1]; const len=Math.hypot(vx,vy)||1e-6; let t=((pt[0]-a[0])*vx+(pt[1]-a[1])*vy)/(len*len); t=Math.max(0,Math.min(1,t)); const px=a[0]+vx*t, py=a[1]+vy*t; const d=Math.hypot(pt[0]-px,pt[1]-py); if(d<best.d) best={d:d,t:(acc+len*t)/lens[si]}; acc+=len; } return best; };
    const render=()=>{ const p=paints[si]; p.style.strokeDashoffset=(+p.dataset.len)*(1-prog); };
    const question=async()=>{ api.hint=null; sdot.style.display='none'; root.querySelector('#lbox').classList.add('done'); confetti(); sfx.cheer();
      await say(`${L}! You painted ${L}, ${SAY()}! ${L}, like ${like}.`); if(!api.alive()) return;
      const pool=shuffle(DISTRACTORS.filter(d=>d[1].charAt(0).toUpperCase()!==L)).slice(0,2); const opts=shuffle([target].concat(pool));
      root.innerHTML=`<div class="banner">Which one starts with ${L}?</div><div class="opts">${opts.map((o,i)=>`<button class="pcard" data-i="${i}"><span class="emo">${o[0]}</span><span class="word">${o[1]}</span></button>`).join('')}</div>`;
      let done=false;
      api.hint=()=>{ say(`Which one starts with ${L}, like ${target[1]}? Tap it.`); ghost(root.querySelector('.pcard')); };
      root.querySelectorAll('.pcard').forEach(b=>b.addEventListener('pointerdown',async()=>{ if(done) return; const o=opts[+b.dataset.i];
        if(o===target){ done=true; api.hint=null; b.classList.add('win'); sfx.ding(); await say(`Yes! ${o[1]} starts with ${L}!`); if(!api.alive()) return; if(!PROG.letters.includes(L)){ PROG.letters.push(L); save('rsh-progress',PROG); } await wait(400); resolve(); }
        else { stumbles++; wobble(b); b.classList.add('faded'); thinkPause(api,`${o[1]} doesn't start with ${L}.`); } }));
      say(`Which one starts with ${L}? Tap it.`); };
    const onDown=e=>{ e.preventDefault(); try{ svg.setPointerCapture(e.pointerId); }catch(x){} down=true; onMove(e); };
    const onMove=e=>{ if(!down||si>=def.strokes.length) return; const pt=toSvg(e); const pr=project(pt); if(pr.d>13) return; if(pr.t>prog && pr.t<prog+.3){ prog=Math.min(1,pr.t); render(); if(prog>=.97){ sfx.pop(); si++; prog=0; if(si<def.strokes.length){ setDot(); say('Lovely! Now the next bit.'); } else { down=false; question(); } } } };
    const onUp=()=>{ down=false; };
    svg.addEventListener('pointerdown',onDown); svg.addEventListener('pointermove',onMove); svg.addEventListener('pointerup',onUp); svg.addEventListener('pointercancel',onUp);
    api.hint=()=>{ say('Put your finger on the green dot, and paint slowly along the grey letter.'); ghost(sdot); };
    say(idx===0
      ? (first?`This is ${L}. ${L} is for ${SAY()}! Hoot says: put your finger on the green dot, and paint slowly along the letter.`:`This is ${L}, like ${like}. Put your finger on the green dot, and paint slowly along the letter.`)
      : `Now the letter ${L}! ${L}, like ${like}. Put your finger on the green dot, and paint slowly along the letter.`);
  });
  (async()=>{ for(let i=0;i<MISSION_LETTERS.length;i++){ await runLetter(MISSION_LETTERS[i],i); if(!api.alive()) return; await wait(300); }
    bump('letter',stumbles); api.sticker(); await wait(500); if(api.alive()) api.next(); })();
}};

const sharkScene={ key:'shark', icon:'🦈', name:"Finn's snack", sticker:'🦈', done:'you fed Finn the shark', enter(root,api){
  const lv=LV.shark||0; const need=6, speed=Math.max(3.2,5.2-lv*.5), ratio=.3+lv*.05; let eaten=0, stumbles=0, spawnT=null, ended=false;
  root.innerHTML=`<div class="water"></div><div class="banner">Feed Finn! Not the spiky ones!</div><div class="fishcount" id="fcount">🐟 0 / ${need}</div><div class="finn" id="finn">${FINN_SVG}</div>`;
  const finn=root.querySelector('#finn'), counter=root.querySelector('#fcount');
  const spawn=()=>{ if(ended||!api.alive()) return; if(root.querySelectorAll('.item:not(.eat):not(.puff)').length>=3) return;
    const bad=Math.random()<ratio; const it=document.createElement('button'); it.className='item'; it.dataset.bad=bad?'1':''; it.textContent=bad?'🐡':'🐟'; it.style.left='100rem'; it.style.top=rnd(10,46)+'rem'; root.appendChild(it);
    requestAnimationFrame(()=>{ it.style.transitionDuration=speed+'s'; it.style.left='-14rem'; });
    setTimeout(()=>{ if(it.parentNode&&!it.classList.contains('eat')&&!it.classList.contains('puff')) it.remove(); },speed*1000+200);
    it.addEventListener('pointerdown',()=>{ if(ended||it.classList.contains('eat')||it.classList.contains('puff')) return;
      const p=posOf(it); it.style.transition='none'; it.style.left=(p.x-5)+'rem'; it.style.top=(p.y-5)+'rem'; void it.offsetWidth;
      if(it.dataset.bad){ stumbles++; it.classList.add('puff'); it.style.top=(p.y-30)+'rem'; finn.classList.remove('ouch'); void finn.offsetWidth; finn.classList.add('ouch'); thinkPause(api,'Ouch! Spiky! Not that one.'); setTimeout(()=>it.remove(),1300); }
      else { it.classList.add('eat'); it.style.left='24rem'; it.style.top='30rem'; finn.classList.remove('chomp'); void finn.offsetWidth; finn.classList.add('chomp'); sfx.yum(); eaten++; counter.textContent=`🐟 ${eaten} / ${need}`; bubble(pick(['Yum!','Chomp!','Doo doo doo!','Tasty!'])); setTimeout(()=>it.remove(),500);
        if(eaten>=need){ ended=true; api.hint=null; clearInterval(spawnT); (async()=>{ await wait(500); confetti(); sfx.cheer(); await say(`Finn is full! Burp! Thank you, ${SAY()}!`); if(!api.alive()) return; bump('shark',stumbles); api.sticker(); await wait(500); api.next(); })(); } } }); };
  api.cleanup=()=>clearInterval(spawnT);
  (async()=>{ await say(`This is Finn, the baby shark. Doo doo doo doo doo doo! Tap the fish to feed Finn. But don't tap the spiky puffer fish!`); if(!api.alive()) return;
    api.hint=()=>{ say('Tap the fish to feed Finn. Not the spiky ones!'); const f=root.querySelector('.item:not([data-bad="1"])'); if(f) ghost(f); };
    spawn(); spawnT=setInterval(spawn,1400); })();
}};

const hqScene={ key:'hq', icon:'🏆', name:'Hero HQ', stop:true, async enter(root,api){
  root.innerHTML=`<div class="hq"><div class="hq-title">Hero Badge!</div><div class="badge-big" id="bb"></div></div>`;
  const bb=root.querySelector('#bb'); stickers.forEach((s,i)=>{ const d=document.createElement('div'); d.className='bs'; d.textContent=s; d.style.animationDelay=(i*.25)+'s'; bb.appendChild(d); });
  confetti(220); sfx.cheer();
  await say(`You did it, ${SAY()}! Now you are a hero like me and Spidey, and you get the HERO status badge!`,{rate:.95,pitch:1.2}); if(!api.alive()) return;
  const recap=doneList.slice(-3); if(recap.length){ await say(`Today ${recap.join(', ')}.`); if(!api.alive()) return; }
  // then the sticker ring makes way for the real golden badge
  bb.classList.add('away'); const g=document.createElement('div'); g.className='gold'; g.innerHTML=GOLD_SVG+'<span class="spark k1">✨</span><span class="spark k2">✨</span><span class="spark k3">✨</span><span class="spark k4">⭐</span>'; root.querySelector('.hq').appendChild(g);
  root.querySelector('.hq-title').textContent='HERO!'; confetti(180); sfx.cheer();
  await say('Here is your shining golden HERO badge!',{pitch:1.15}); if(!api.alive()) return;
  PROG.missions=(PROG.missions||0)+1; PROG.lastPlayed=new Date().toISOString().slice(0,10); save('rsh-progress',PROG);
  whisk.classList.add('breath'); await say('One big breath together… in… and out.'); whisk.classList.remove('breath'); if(!api.alive()) return;
  await wait(600); if(!api.alive()) return;
  showNight('Bye-bye! 👋', SET.bye||'');
  sfx.bye(); await say(`Bye-bye, ${SAY()}! ${SET.bye?SET.bye+' ':''}See you tomorrow.`); if(!api.alive()) return;
  $('#again').classList.add('on');
}};

// ---------- mission runner
const SCENES=[introScene,balloonScene,greenScene,flashScene,karutaScene,shapesScene,countScene,letterScene,sharkScene,hqScene];
let active=[], cur=null, curApi=null, runId=0;
function compose(){ active=SCENES.filter(s=>s.key==='intro'||s.key==='hq'||SET.slides[s.key]!==false); }
const stopsOf=()=>active.filter(s=>s.key!=='intro');
function renderStrip(idx){ const stops=stopsOf(), c=idx-1; strip.innerHTML=stops.map((s,i)=>`<div class="stop ${i<c?'done':''} ${i===c?'cur':''}">${i<c?'✓':s.icon}</div>${i<stops.length-1?'<div class="dash"></div>':''}`).join(''); strip.style.visibility=idx<1?'hidden':'visible'; }
async function drive(next){ const d=$('#drive'); $('#nextstop').textContent='Next stop: '+next.name+'!'; d.classList.add('on'); say(`Beep beep! Next stop: ${next.name}!`); await wait(3400); d.classList.remove('on'); }
function goScene(i){
  runId++; const my=runId; const alive=()=>my===runId;
  if(curApi&&curApi.cleanup){ try{ curApi.cleanup(); }catch(e){} }
  engineStop(); ghostEl.classList.remove('on'); cur=active[i]; if(!cur) return;
  const api={ alive:alive, phase:'', hint:null, cleanup:null, pause:null, resume:null,
    sticker(){ if(cur.sticker){ addSticker(cur.sticker); doneList.push(cur.done); } },
    next:async()=>{ if(!alive()) return; const nx=active[i+1]; if(!nx) return; if(i>0) await drive(nx); if(alive()) goScene(i+1); } };
  curApi=api; renderStrip(i); setSky(i<1?0:(i-1)/Math.max(1,stopsOf().length-1)); sceneRoot.innerHTML=''; lastTouch=Date.now(); hintCount=0;
  cur.enter(sceneRoot,api);
}
function showNight(title,sub){ const n=$('#night'); n.querySelector('.bye').textContent=title; n.querySelector('.sub').textContent=sub||''; n.classList.add('on'); }
function reset(){ stickers.length=0; doneList.length=0; badge.innerHTML=''; ['#night','#again','#drive','#calm','#parent'].forEach(s=>$(s).classList.remove('on')); if(synth) synth.cancel(); sleeping=false; compose(); goScene(0); }
$('#horn').addEventListener('pointerdown',()=>{ sfx.horn(); bubble('Beep beep!'); });
$('#cloud').addEventListener('click',()=>{
  const c=$('#calm'); if(c.classList.contains('on')) return; audio();
  if(curApi&&curApi.pause) curApi.pause(); c.classList.add('on');
  say('Calm cloud. Hold the balloon, and breathe in…');
  balloonWidget(c.querySelector('.cb'),{breaths:1, onDone:async()=>{ await say('Nice and calm. Back we go!'); c.classList.remove('on'); c.querySelector('.cb').innerHTML=''; if(curApi&&curApi.resume) curApi.resume(); else if(curApi&&curApi.hint) curApi.hint(); }});
});
holdButton($('#again'),1500,reset);

// idle nudges (a hint after 15 s of nothing, four at most) and a sleep screen after 2.5 minutes
let lastTouch=Date.now(), lastHint=0, hintCount=0, sleeping=false;
document.addEventListener('pointerdown',()=>{ lastTouch=Date.now(); if(sleeping){ sleeping=false; $('#night').classList.remove('on'); if(curApi&&curApi.hint) curApi.hint(); } },true);
setInterval(()=>{ if(!cur||cur.key==='intro'||cur.key==='hq'||sleeping||$('#parent').classList.contains('on')||$('#calm').classList.contains('on')) return;
  const idle=Date.now()-lastTouch;
  if(idle>150000){ sleeping=true; showNight('Sleepy time 💤','Tap to wake up'); if(synth) synth.cancel(); return; }
  if(idle>15000 && Date.now()-lastHint>15000 && curApi&&curApi.hint && hintCount<4){ lastHint=Date.now(); hintCount++; try{ curApi.hint(); }catch(e){} } },1000);

// parent corner (hold the gear for 1.5 s)
function fillVoices(){ const sel=$('#p-voice'); const vs=englishVoices(); sel.innerHTML='<option value="">Automatic (calm female voice)</option>'+vs.map(v=>`<option value="${v.name.replace(/"/g,'&quot;')}">${v.name} (${v.lang})</option>`).join(''); sel.value=SET.voice||''; }
function openParent(){ const p=$('#parent'); if(curApi&&curApi.pause) curApi.pause(); if(synth) synth.cancel();
  $('#p-name').value=SET.name; $('#p-say').value=SET.sayAs; $('#p-bye').value=SET.bye||''; fillVoices();
  $('#p-slides').innerHTML=SCENES.filter(s=>s.sticker).map(s=>`<label><input type="checkbox" data-k="${s.key}" ${SET.slides[s.key]===false?'':'checked'}><span>${s.icon} ${s.name}</span></label>`).join('');
  $('#p-stats').textContent=`Missions finished: ${PROG.missions||0} · Longest wait for green: ${PROG.longestWait||0} s · Letters painted: ${PROG.letters.join(' ')||'none yet'} · Levels: ${Object.keys(LV).map(k=>k+' '+LV[k]).join(', ')}`;
  p.classList.add('on'); }
function saveParent(){ SET.name=($('#p-name').value||'Hero').trim().slice(0,20); SET.sayAs=($('#p-say').value||SET.name).trim().slice(0,24); SET.bye=$('#p-bye').value.trim().slice(0,60); SET.voice=$('#p-voice').value;
  $('#p-slides').querySelectorAll('input').forEach(i=>{ SET.slides[i.dataset.k]=i.checked; }); save('rsh-settings',SET); pickVoice(); }
holdButton($('#gear'),1500,openParent);
$('#p-test').addEventListener('click',()=>{ audio(); SET.voice=$('#p-voice').value; pickVoice(); say(`Hello ${($('#p-say').value||'Hero').trim()}! I am Whiskers. Ready, steady, hero!`); });
$('#p-save').addEventListener('click',()=>{ saveParent(); bubble('Saved.'); });
$('#p-close').addEventListener('click',()=>{ saveParent(); $('#parent').classList.remove('on'); if(curApi&&curApi.resume) curApi.resume(); else if(curApi&&curApi.hint) curApi.hint(); });
$('#p-replay').addEventListener('click',()=>{ saveParent(); reset(); });
$('#p-reset').addEventListener('click',()=>{ Object.keys(LV).forEach(k=>LV[k]=0); save('rsh-levels',LV); PROG.letters=[]; PROG.longestWait=0; save('rsh-progress',PROG); bubble('Levels reset.'); $('#p-stats').textContent='Levels reset.'; });

document.addEventListener('visibilitychange',()=>{ if(document.hidden){ if(synth) synth.cancel(); engineStop(); } });
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());
window.__rsh={ go:goScene, locked:touchLocked, sticker:addSticker, set:SET, lv:LV, prog:PROG, voice:()=>voice&&voice.name, sfx:sfx };   // parent/dev hook: __rsh.go(2) jumps to a slide
compose(); goScene(0);
})();
</script>
